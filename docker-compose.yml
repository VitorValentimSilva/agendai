# Postgres local para desenvolvimento: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: agendai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendai
    ports:
      - '5432:5432'
    volumes:
      - agendai-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agendai-pgdata:
